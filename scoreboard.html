<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        onSnapshot
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // YOUR FIREBASE CONFIG

    const firebaseConfig = {
        apiKey: "AIzaSyApvakGAfMcDM_hfaaUrbs_1w3xLIwMctE",
        authDomain: "abm-scoreboard.firebaseapp.com",
        projectId: "abm-scoreboard",
        storageBucket: "abm-scoreboard.firebasestorage.app",
        messagingSenderId: "684237199515",
        appId: "1:684237199515:web:a7d9025da138d93e340e3e"
    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // Firebase scoreboard location

    const scoreboardRef =
        doc(db, "scoreboard", "scores");


    // Listen for live score changes

    onSnapshot(scoreboardRef, (snapshot) => {

        if (!snapshot.exists()) {

            document.getElementById("status").textContent =
                "Scoreboard data not found.";

            return;
        }


        const data = snapshot.data();


        const gwu = Number(data.GWu || 0);
        const atb = Number(data.ATb || 0);


        document.getElementById("gwuScore")
            .textContent = gwu;

        document.getElementById("atbScore")
            .textContent = atb;


        // Find the leading team

        if (gwu > atb) {

            document.getElementById("leading").textContent =
                "Team GWu is leading";

        } else if (atb > gwu) {

            document.getElementById("leading").textContent =
                "Team ATb is leading";

        } else {

            document.getElementById("leading").textContent =
                "The teams are tied";

        }

    });

</script>

</body>
